version: "3.8"

services:
  unicompass:
    build: .
    container_name: unicompass_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=replace-with-a-secure-random-key-in-production
      - DATA_DIR=/app/data
    volumes:
      # Single persistent volume containing all SQLite DB, users.csv, and exported CSV/XLSX files
      - ./data:/app/data
